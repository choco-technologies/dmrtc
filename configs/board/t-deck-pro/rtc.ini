; LILYGO T-Deck Pro (ESP32-S3): no RTC chip on the board, the calendar is kept by the RTC timer of the ESP32-S3 (see src/port/esp32s3/port.c).
; clock=lsi: the internal RC oscillator, nominal 136 kHz (measured when the calendar is set; the value here is only the nominal one).
; backup_register is not used by this port.
[rtc]
driver_name=dmrtc
driver_order=0
instance=0
clock=lsi
clock_hz=136000
timeout_ms=5000
backup_register=0
